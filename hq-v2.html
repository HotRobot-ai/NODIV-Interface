<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NODIV // HQ VR V2 // CENTRAL OPERATIONS WUERZBURG</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>
html,body{margin:0;background:#02070c;font-family:Arial,sans-serif}
#boot{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#70eaff;letter-spacing:.22em;text-align:center;text-shadow:0 0 18px #00bde8;background:radial-gradient(circle at center,#06202a 0,#02070c 55%,#000 100%);animation:boot 3.2s forwards}
#boot b{font-size:clamp(28px,7vw,70px);display:block}.sub{font-size:12px;margin-top:14px;opacity:.75}
@keyframes boot{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
</style>
<script>
AFRAME.registerComponent('holo-pulse', {
  init:function(){ this.phase=Math.random()*Math.PI*2; },
  tick:function(t){ const y=1+Math.sin(t/700+this.phase)*.06; this.el.object3D.scale.set(y,y,y); }
});


AFRAME.registerComponent('quest-locomotion', {
  schema:{speed:{default:2.0}, snap:{default:30}, deadzone:{default:.22}},
  init:function(){
    this.left={x:0,y:0}; this.right={x:0,y:0}; this.turnReady=true;
    const rig=this.el, left=document.querySelector('#leftHand'), right=document.querySelector('#rightHand');
    const axis=(hand,side)=>e=>{ const a=e.detail.axis||[]; hand.x=a.length>2?(a[2]||0):(a[0]||0); hand.y=a.length>3?(a[3]||0):(a[1]||0); };
    if(left) left.addEventListener('axismove',axis(this.left,'left'));
    if(right) right.addEventListener('axismove',axis(this.right,'right'));
  },
  tick:function(t,dt){
    if(!dt) return;
    const cam=document.querySelector('#playerCamera'); if(!cam) return;
    const dz=this.data.deadzone, lx=Math.abs(this.left.x)>dz?this.left.x:0, ly=Math.abs(this.left.y)>dz?this.left.y:0;
    if(lx||ly){
      const yaw=THREE.MathUtils.degToRad(cam.object3D.rotation.y + this.el.object3D.rotation.y);
      const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
      const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
      const v=f.multiplyScalar(-ly).add(r.multiplyScalar(lx)).multiplyScalar(this.data.speed*dt/1000);
      this.el.object3D.position.add(v);
    }
    const rx=this.right.x;
    if(Math.abs(rx)<dz) this.turnReady=true;
    if(this.turnReady && Math.abs(rx)>.72){
      this.el.object3D.rotation.y-=THREE.MathUtils.degToRad(Math.sign(rx)*this.data.snap);
      this.turnReady=false;
    }
  }
});

AFRAME.registerComponent('node-console', {
  init: function () {
    const detail = document.querySelector('#nodeDetail');
    const base = document.querySelector('#nodeBase');
    let open = false;
    this.el.addEventListener('click', () => {
      open = !open;
      detail.setAttribute('visible', open);
      base.setAttribute('visible', !open);
      this.el.setAttribute('material', 'color', open ? '#07546a' : '#03141d');
    });
  }
});

const NODIV_API = 'https://script.google.com/macros/s/AKfycby1cZye2Z46M2ydV6-TcurgOwmS8H4Bh6eXZJ3Z76TUs2oPO5eq6l-RGL0AyVQmfpeM3w/exec';

function hqSetText(id, value) {
  const el = document.querySelector(id);
  if (el) el.setAttribute('value', value);
}

function hqLoadLiveOperations() {
  const callback = 'nodivHqLive_' + Date.now();
  const script = document.createElement('script');
  window[callback] = function (data) {
    try {
      if (!data || !data.ok) throw new Error('HQ data unavailable');

      const nodes = Array.isArray(data.nodes) ? data.nodes : [];
      const deployments = Array.isArray(data.deployments) ? data.deployments : [];
      const registered = Number(data.network && data.network.registeredNodes || 0);
      const networkStatus = String(data.network && data.network.status || 'UNKNOWN');
      const cargo = deployments.find(d => d.status === 'IN_TRANSIT') || deployments[0] || null;
      const liveNodes = nodes.filter(n => n.registered);
      const n1 = liveNodes.find(n => n.id === 'NODE-001') || liveNodes[0] || null;
      const n1Energy = n1 ? Number(n1.energy ?? n1.totalEnergy ?? n1.energyTotal ?? 0) : 0;
      const n1State = n1 ? String(n1.status || (n1Energy >= 600 ? 'STABLE' : n1Energy >= 450 ? 'DEGRADED' : 'CRITICAL')) : 'OFFLINE';
      const stateColor = n1State === 'STABLE' ? '#62ffad' : n1State === 'DEGRADED' ? '#ffd36a' : '#ff657a';
      hqSetText('#holoNodeTitle', n1 ? n1.id + ' // ' + n1State : 'NODE-001 // OFFLINE');
      hqSetText('#holoNodeEnergy', n1 ? 'ENERGY  //  ' + (n1Energy || '--') + ' E' : 'ENERGY  //  --');
      const beacon=document.querySelector('#holoNodeBeacon');
      if(beacon) beacon.setAttribute('material','color',stateColor);

      hqSetText('#missionLiveText',
        'SYSTEM  //  ' + networkStatus +
        '\\nMISSION CARGO  //  ' + String(deployments.length).padStart(2,'0') +
        '\\nFIELD  //  LIVE');

      hqSetText('#nodeLiveText',
        'NETWORK  //  LIVE' +
        '\\nNODES  //  ' + registered +
        '\\nLINK  //  SECURE');

      const nodeLines = nodes.filter(n => n.registered).slice(0,3)
        .map(n => n.id + '   ' + n.status);
      hqSetText('#nodeTacticalText',
        (nodeLines.length ? nodeLines.join('\\n') : 'NO REGISTERED NODES') +
        '\\n\\nNETWORK   ' + registered + ' NODES' +
        '\\nSTATUS    ' + networkStatus);

      if (cargo) {
        hqSetText('#fieldLiveTitle', 'MISSION CARGO // ' + cargo.status);
        hqSetText('#fieldLiveText',
          'TARGET  //  ' + (cargo.targetNode || '—') +
          '\\nENERGY  //  ' + (cargo.energy === '' ? '—' : cargo.energy + ' E') +
          '\\nCARRIER  //  ' + (cargo.carrierId || '—'));
      } else {
        hqSetText('#fieldLiveTitle', 'FIELD OPERATIONS');
        hqSetText('#fieldLiveText',
          'MISSION CARGO  //  CLEAR' +
          '\\nDEPLOYMENTS  //  00' +
          '\\nSTATUS  //  NOMINAL');
      }
    } catch (error) {
      hqSetText('#missionLiveText','SYSTEM  //  DATA LINK ERROR\\nMISSION CARGO  //  --\\nFIELD  //  OFFLINE');
    } finally {
      delete window[callback];
      script.remove();
    }
  };
  script.onerror = function () {
    hqSetText('#missionLiveText','SYSTEM  //  DATA LINK ERROR\\nMISSION CARGO  //  --\\nFIELD  //  OFFLINE');
    delete window[callback];
    script.remove();
  };
  script.src = NODIV_API + '?action=hqstatus&callback=' + encodeURIComponent(callback) + '&_=' + Date.now();
  document.body.appendChild(script);
}

window.addEventListener('load', function () {
  setTimeout(hqLoadLiveOperations, 1200);
  setInterval(hqLoadLiveOperations, 15000);
});
</script>
