<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05090d">
  <title>NODIV V2 // FIELD INTERFACE</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>

  <section id="auth" class="panel hero access-hero">
    <div class="access-art" aria-hidden="true"><div class="energy-ring"><div class="energy-core"></div></div></div>
    <button id="btnAuth" class="primary">ACCESS CARD SCANNEN</button>
    <div class="access-signature"><strong>ENERGY <span class="motto-dot" aria-hidden="true">·</span> BEYOND <span class="motto-dot" aria-hidden="true">·</span> LIMITS</strong></div>
    <div id="authOut" class="feedback" role="status"></div>
  </section>

  <section id="roleShell" hidden>
    <header class="role-head">
      <div><small id="roleChannel">NODIV // FIELD</small><h2 id="roleIdentity">—</h2><p id="roleName">—</p></div>
      <div class="role-sigil" aria-hidden="true"></div>
    </header>

    <section id="nextAction" class="next-card">
      <small>NÄCHSTER SCHRITT</small>
      <strong id="nextTitle">—</strong>
      <p id="nextDetail"></p>
    </section>

    <section id="flowBar" class="flow-bar" data-phase="idle" hidden>
      <span id="flowPhase">BEREIT</span>
      <strong id="flowMessage">—</strong>
    </section>

    <div id="roleContent"></div>

    <button id="btnLock" class="ghost">INTERFACE SPERREN</button>
    <footer class="nodiv-signature" aria-label="NODIV Motto">ENERGY BEYOND LIMITS <span>// NODIV</span></footer>
  </section>

  <details id="diagnostics" class="diagnostics">
    <summary>SYSTEMDIAGNOSE // TESTMODUS</summary>
  <section class="system-strip"><span id="health">VERBINDUNG WIRD GEPRÜFT</span><span id="clock">—</span></section>
    <p class="lab-flag">TESTMODUS · LOKALER SPIELSTAND · KEINE PRODUKTIVDATEN</p>
    <p>Nur für den isolierten Teststand. Diese Daten steuern keine Spielregel.</p>
    <button id="btnRestartSave" disabled>ZUSTAND VOR NEUSTART SPEICHERN</button>
    <button id="btnRestartCompare" disabled>NACH NEUSTART VERGLEICHEN</button>
    <div id="restartOut" class="feedback mono"></div>
    <button id="btnLatency">HANDY-LATENZ MESSEN</button>
    <div id="latencyOut" class="feedback mono"></div>
    <button id="btnState" disabled>TECHNISCHEN SERVERSTAND LADEN</button>
    <pre id="stateOut">—</pre>
  </details>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
