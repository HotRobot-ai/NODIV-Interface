<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA // N-Core Registration</title>

  <style>
    body {
      margin: 0;
      background: #050b14;
      color: #eaf6ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 35px 22px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .subbrand {
      color: #5bc7ff;
      letter-spacing: 4px;
      font-size: 12px;
      margin-top: 6px;
    }

    .line {
      height: 2px;
      background: #168bd2;
      margin: 25px 0 35px;
    }

    .mode {
      color: #5bc7ff;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      background: #0a1522;
      border: 1px solid #24465e;
      color: white;
      font-size: 18px;
      text-align: center;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 25px;
      background: #087fc1;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status {
      margin-top: 30px;
      padding: 20px;
      min-height: 90px;
      border: 1px solid #17374c;
      background: #07111c;
      white-space: pre-line;
      line-height: 1.6;
    }

    .success {
      color: #62e6a7;
    }

    .error {
      color: #ff7373;
    }

    .uid {
      color: #5bc7ff;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">NEXORA</div>
  <div class="subbrand">ENERGY SYSTEMS</div>

  <div class="line"></div>

  <div class="mode">
    N-CORE // REGISTRATION TERMINAL
  </div>

  <input id="core" type="text" value="NC-001" placeholder="N-CORE ID">

  <input id="energy" type="number" value="618" placeholder="ENERGY">

  <button id="scanButton" onclick="scanNFC()">
    SCAN N-CORE
  </button>

  <div id="status">
    SYSTEM READY
  </div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycby1cZye2Z46M2ydV6-TcurgOwmS8H4Bh6eXZJ3Z76TUs2oPO5eq6l-RGL0AyVQmfpeM3w/exec";

let scanRunning = false;
let scanController = null;

async function scanNFC() {

  const status = document.getElementById("status");
  const button = document.getElementById("scanButton");

  if (scanRunning) {
    return;
  }

  if (!("NDEFReader" in window)) {
    status.className = "error";
    status.innerText =
      "NFC INTERFACE NOT AVAILABLE\n\nAndroid + Chrome erforderlich.";
    return;
  }

  let core =
    document.getElementById("core").value.trim().toUpperCase();

  let energy =
    document.getElementById("energy").value.trim();

  if (!/^NC-\d{3}$/.test(core)) {
    status.className = "error";
    status.innerText =
      "CORE ID FORMAT ERROR\n\nBeispiel: NC-001";
    return;
  }

  const coreNumber =
    parseInt(core.substring(3), 10);

  if (coreNumber < 1 || coreNumber > 200) {
    status.className = "error";
    status.innerText =
      "CORE OUT OF RANGE\n\nNC-001 // NC-200";
    return;
  }

  if (!energy) {
    status.className = "error";
    status.innerText =
      "ENERGY VALUE MISSING";
    return;
  }

  try {

    scanRunning = true;
    button.disabled = true;

    scanController = new AbortController();

    const reader = new NDEFReader();

    reader.onreading = async event => {

      if (!scanRunning) {
        return;
      }

      /*
       * Ab hier darf dieser Scan nur EINMAL verarbeitet werden.
       */

      scanRunning = false;

      /*
       * NFC-Reader sofort beenden.
       */

      if (scanController) {
        scanController.abort();
        scanController = null;
      }

      /*
       * Werte JETZT noch einmal aus der Oberfläche lesen.
       */

      core =
        document.getElementById("core").value.trim().toUpperCase();

      energy =
        document.getElementById("energy").value.trim();

      const uid =
        String(event.serialNumber || "").trim().toUpperCase();

      if (!/^NC-\d{3}$/.test(core)) {
        button.disabled = false;

        status.className = "error";
        status.innerText =
          "CORE ID FORMAT ERROR\n\nREGISTRATION ABORTED";
        return;
      }

      const scannedCoreNumber =
        parseInt(core.substring(3), 10);

      if (
        scannedCoreNumber < 1 ||
        scannedCoreNumber > 200
      ) {
        button.disabled = false;

        status.className = "error";
        status.innerText =
          "CORE OUT OF RANGE\n\nREGISTRATION ABORTED";
        return;
      }

      if (!energy) {
        button.disabled = false;

        status.className = "error";
        status.innerText =
          "ENERGY VALUE MISSING\n\nREGISTRATION ABORTED";
        return;
      }

      if (!uid) {
        button.disabled = false;

        status.className = "error";
        status.innerText =
          "N-CORE DETECTED\n\nUID NOT AVAILABLE";
        return;
      }

      status.className = "uid";
      status.innerText =
        "N-CORE DETECTED\n\n" +
        "REGISTERING // " + core +
        "\n" +
        "ENERGY // " + energy +
        "\n" +
        "UID // " + uid +
        "\n\n" +
        "CONNECTING TO NEXORA DATABASE...";

      const url =
        API +
        "?action=register" +
        "&core=" + encodeURIComponent(core) +
        "&energy=" + encodeURIComponent(energy) +
        "&uid=" + encodeURIComponent(uid);

      try {

        await fetch(url, {
          method: "GET",
          mode: "no-cors",
          cache: "no-store"
        });

        status.className = "success";

        status.innerText =
          "N-CORE REGISTERED\n\n" +
          core +
          "\n" +
          "ENERGY // " + energy +
          "\n" +
          "UID // " + uid +
          "\n\n" +
          "CHIP STATUS // ERFASST";

        setTimeout(() => {

          const coreInput =
            document.getElementById("core");

          const energyInput =
            document.getElementById("energy");

          if (scannedCoreNumber < 200) {

            coreInput.value =
              "NC-" +
              String(scannedCoreNumber + 1).padStart(3, "0");

            energyInput.value = "";

            status.className = "";

            status.innerText =
              "SYSTEM READY\n\nNEXT // " +
              coreInput.value;

            button.disabled = false;

            energyInput.focus();

          } else {

            energyInput.value = "";

            status.className = "success";

            status.innerText =
              "REGISTRATION SERIES COMPLETE\n\n" +
              "NC-001 // NC-200";

            button.disabled = true;
          }

        }, 3000);

      } catch (error) {

        button.disabled = false;

        status.className = "error";

        status.innerText =
          "DATABASE CONNECTION ERROR\n\n" +
          error.message;
      }
    };

    reader.onreadingerror = () => {

      if (scanRunning) {
        scanRunning = false;
      }

      if (scanController) {
        scanController.abort();
        scanController = null;
      }

      button.disabled = false;

      status.className = "error";

      status.innerText =
        "NFC READ ERROR\n\n" +
        "N-Core erneut an das Smartphone halten.";
    };

    await reader.scan({
      signal: scanController.signal
    });

    status.className = "";

    status.innerText =
      "NFC INTERFACE ACTIVE\n\n" +
      "PRESENT N-CORE";

  } catch (error) {

    scanRunning = false;

    scanController = null;

    button.disabled = false;

    if (error.name === "AbortError") {
      return;
    }

    status.className = "error";

    status.innerText =
      "NFC ERROR\n\n" +
      error.message;
  }
}

</script>

</body>
</html>
