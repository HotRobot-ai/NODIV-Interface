<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>NEXORA // N-Core Registration</title>

  <style>

    body {
      margin: 0;
      background: #050b14;
      color: #eaf6ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 35px 22px;
    }

    .brand {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .subbrand {
      color: #5bc7ff;
      letter-spacing: 4px;
      font-size: 12px;
      margin-top: 6px;
    }

    .line {
      height: 2px;
      background: #168bd2;
      margin: 25px 0 35px;
    }

    .mode {
      color: #5bc7ff;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      background: #0a1522;
      border: 1px solid #24465e;
      color: white;
      font-size: 18px;
      text-align: center;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 20px;
      margin-top: 25px;
      background: #087fc1;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #status {
      margin-top: 30px;
      padding: 20px;
      min-height: 90px;
      border: 1px solid #17374c;
      background: #07111c;
      white-space: pre-line;
      line-height: 1.6;
    }

    .success {
      color: #62e6a7;
    }

    .error {
      color: #ff7373;
    }

    .uid {
      color: #5bc7ff;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    NEXORA
  </div>

  <div class="subbrand">
    ENERGY SYSTEMS
  </div>

  <div class="line"></div>

  <div class="mode">
    N-CORE // REGISTRATION TERMINAL
  </div>

  <input
    id="core"
    type="text"
    value=""
    placeholder="N-CORE ID">

  <input
    id="energy"
    type="number"
    value=""
    placeholder="ENERGY">

  <button
    id="scanButton"
    onclick="scanNFC()"
    disabled>

    SCAN N-CORE

  </button>

  <div id="status">
    CONNECTING TO NEXORA DATABASE...
  </div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycby1cZye2Z46M2ydV6-TcurgOwmS8H4Bh6eXZJ3Z76TUs2oPO5eq6l-RGL0AyVQmfpeM3w/exec";


let scanRunning = false;
let scanController = null;


/*
 * JSONP Request
 */
function apiRequest(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "nexoraCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error(
            "SERVER RESPONSE TIMEOUT"
          )
        );

      }, 10000);


    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }
    }


    window[callbackName] = data => {

      cleanup();

      resolve(data);
    };


    const query =
      new URLSearchParams({
        ...params,
        callback: callbackName,
        _: Date.now()
      });


    script.onerror = () => {

      cleanup();

      reject(
        new Error(
          "SERVER CONNECTION ERROR"
        )
      );
    };


    script.src =
      API +
      "?" +
      query.toString();


    document.body.appendChild(script);
  });
}


/*
 * Beim Start automatisch
 * ersten freien N-Core laden.
 */
async function initializeTerminal() {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("scanButton");

  const coreInput =
    document.getElementById("core");

  const energyInput =
    document.getElementById("energy");

  try {

    const response =
      await apiRequest({
        action: "nextfree"
      });


    if (!response.ok) {

      throw new Error(
        response.error ||
        "UNKNOWN SERVER ERROR"
      );
    }


    if (!response.nextFreeCore) {

      status.className = "success";

      status.innerText =
        "REGISTRATION SERIES COMPLETE\n\n" +
        "ALL N-CORES REGISTERED";

      button.disabled = true;

      return;
    }


    coreInput.value =
      response.nextFreeCore;

    energyInput.value = "";

    status.className = "";

    status.innerText =
      "SYSTEM READY\n\nNEXT // " +
      response.nextFreeCore;

    button.disabled = false;

    energyInput.focus();


  } catch (error) {

    status.className = "error";

    status.innerText =
      "DATABASE CONNECTION ERROR\n\n" +
      error.message;

    button.disabled = true;
  }
}



async function scanNFC() {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("scanButton");


  if (scanRunning) {
    return;
  }


  if (!("NDEFReader" in window)) {

    status.className = "error";

    status.innerText =
      "NFC INTERFACE NOT AVAILABLE\n\n" +
      "Android + Chrome erforderlich.";

    return;
  }


  let core =
    document
      .getElementById("core")
      .value
      .trim()
      .toUpperCase();


  let energy =
    document
      .getElementById("energy")
      .value
      .trim();


  if (!/^NC-\d{3}$/.test(core)) {

    status.className = "error";

    status.innerText =
      "CORE ID FORMAT ERROR\n\n" +
      "Beispiel: NC-001";

    return;
  }


  const coreNumber =
    parseInt(
      core.substring(3),
      10
    );


  if (
    coreNumber < 1 ||
    coreNumber > 200
  ) {

    status.className = "error";

    status.innerText =
      "CORE OUT OF RANGE\n\n" +
      "NC-001 // NC-200";

    return;
  }


  if (!energy) {

    status.className = "error";

    status.innerText =
      "ENERGY VALUE MISSING";

    return;
  }


  try {

    scanRunning = true;

    button.disabled = true;


    scanController =
      new AbortController();


    const reader =
      new NDEFReader();


    let handled = false;


    reader.onreading =
      async event => {

        /*
         * Zusätzliche Sicherung:
         * exakt ein NFC-Event verarbeiten.
         */
        if (
          handled ||
          !scanRunning
        ) {
          return;
        }

        handled = true;
        scanRunning = false;


        if (scanController) {

          scanController.abort();

          scanController = null;
        }


        /*
         * Werte beim echten NFC-Kontakt
         * nochmals lesen.
         */
        core =
          document
            .getElementById("core")
            .value
            .trim()
            .toUpperCase();


        energy =
          document
            .getElementById("energy")
            .value
            .trim();


        const uid =
          String(
            event.serialNumber || ""
          )
            .trim()
            .toUpperCase();


        if (!/^NC-\d{3}$/.test(core)) {

          button.disabled = false;

          status.className = "error";

          status.innerText =
            "CORE ID FORMAT ERROR\n\n" +
            "REGISTRATION ABORTED";

          return;
        }


        if (!energy) {

          button.disabled = false;

          status.className = "error";

          status.innerText =
            "ENERGY VALUE MISSING\n\n" +
            "REGISTRATION ABORTED";

          return;
        }


        if (!uid) {

          button.disabled = false;

          status.className = "error";

          status.innerText =
            "N-CORE DETECTED\n\n" +
            "UID NOT AVAILABLE";

          return;
        }


        status.className = "uid";

        status.innerText =
          "N-CORE DETECTED\n\n" +
          "REGISTERING // " +
          core +
          "\n" +
          "ENERGY // " +
          energy +
          "\n" +
          "UID // " +
          uid +
          "\n\n" +
          "CONNECTING TO NEXORA DATABASE...";


        try {

          const response =
            await apiRequest({
              action: "register",
              core: core,
              energy: energy,
              uid: uid
            });


          /*
           * Jetzt zählt ausschließlich
           * die echte Serverantwort.
           */
          if (!response.ok) {

            status.className = "error";

            status.innerText =
              "REGISTRATION REJECTED\n\n" +
              (response.error ||
               "UNKNOWN SERVER ERROR") +
              "\n\n" +
              "NO DATA CHANGED";

            button.disabled = false;

            return;
          }


          status.className = "success";

          status.innerText =
            "N-CORE REGISTERED\n\n" +
            response.core +
            "\n" +
            "ENERGY // " +
            response.energy +
            "\n" +
            "UID // " +
            response.uid +
            "\n\n" +
            "CHIP STATUS // " +
            response.chipStatus;


          setTimeout(() => {

            const coreInput =
              document.getElementById("core");

            const energyInput =
              document.getElementById("energy");


            if (
              response.nextFreeCore
            ) {

              coreInput.value =
                response.nextFreeCore;

              energyInput.value = "";

              status.className = "";

              status.innerText =
                "SYSTEM READY\n\n" +
                "NEXT // " +
                response.nextFreeCore;

              button.disabled = false;

              energyInput.focus();


            } else {

              energyInput.value = "";

              status.className = "success";

              status.innerText =
                "REGISTRATION SERIES COMPLETE\n\n" +
                "ALL N-CORES REGISTERED";

              button.disabled = true;
            }

          }, 3000);


        } catch (error) {

          button.disabled = false;

          status.className = "error";

          status.innerText =
            "DATABASE CONNECTION ERROR\n\n" +
            error.message +
            "\n\n" +
            "REGISTRATION NOT CONFIRMED";
        }
      };


    reader.onreadingerror = () => {

      scanRunning = false;


      if (scanController) {

        scanController.abort();

        scanController = null;
      }


      button.disabled = false;

      status.className = "error";

      status.innerText =
        "NFC READ ERROR\n\n" +
        "N-Core erneut an das Smartphone halten.";
    };


    await reader.scan({
      signal: scanController.signal
    });


    status.className = "";

    status.innerText =
      "NFC INTERFACE ACTIVE\n\n" +
      "PRESENT N-CORE";


  } catch (error) {

    scanRunning = false;
    scanController = null;

    button.disabled = false;


    if (
      error.name === "AbortError"
    ) {
      return;
    }


    status.className = "error";

    status.innerText =
      "NFC ERROR\n\n" +
      error.message;
  }
}


/*
 * Terminal starten.
 */
window.addEventListener(
  "load",
  initializeTerminal
);

</script>

</body>
</html>
