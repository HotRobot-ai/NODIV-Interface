<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#02070d">

<title>NEXORA // N-Core Registration Terminal</title>

<style>

:root {
  --bg:#02070d;
  --panel:rgba(2,11,20,.88);
  --panel2:rgba(4,19,32,.92);

  --blue:#27bfff;
  --blue2:#087fc0;
  --blue3:#9ce6ff;

  --text:#eefaff;
  --muted:#79a5bd;

  --success:#52efb4;
  --error:#ff6874;

  --border:rgba(39,191,255,.32);
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
  background:#010409;
}

body {
  color:var(--text);

  font-family:
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

  overflow-x:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background {
  position:fixed;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,5,11,.04) 0%,
      rgba(0,5,11,.08) 28%,
      rgba(1,8,15,.48) 48%,
      rgba(1,7,13,.92) 68%,
      rgba(1,5,10,.98) 100%
    ),
    url("nexora-terminal-bg.png")
    center top / cover no-repeat;

  z-index:0;
}

.background::after {
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 44%,
      rgba(15,153,224,.06),
      transparent 35%
    );
}

/* =========================================================
   PAGE
========================================================= */

.page {
  position:relative;
  z-index:2;

  min-height:100vh;

  width:100%;

  display:flex;
  justify-content:center;

  padding:
    calc(12px + env(safe-area-inset-top))
    10px
    calc(18px + env(safe-area-inset-bottom));
}

.terminal {
  width:100%;
  max-width:560px;

  padding-top:330px;
}

/* =========================================================
   TITLE
========================================================= */

.terminal-heading {
  text-align:center;

  margin-bottom:18px;

  text-shadow:
    0 0 12px rgba(34,178,255,.35);
}

.heading-main {
  font-size:14px;
  letter-spacing:3.5px;

  color:#f0fbff;
}

.heading-sub {
  margin-top:7px;

  color:var(--blue3);

  font-size:7px;
  letter-spacing:2.4px;
}

/* =========================================================
   MAIN PANEL
========================================================= */

.interface-panel {
  position:relative;

  border:
    1px solid rgba(39,191,255,.32);

  background:
    linear-gradient(
      180deg,
      rgba(3,15,27,.91),
      rgba(2,9,17,.96)
    );

  box-shadow:
    0 0 32px rgba(0,132,202,.10),
    inset 0 0 30px rgba(30,179,245,.03);

  padding:
    14px 12px 16px;

  backdrop-filter:
    blur(7px);
}

.interface-panel::before {
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background-image:
    linear-gradient(
      rgba(41,185,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(41,185,255,.025) 1px,
      transparent 1px
    );

  background-size:
    22px 22px;
}

/* =========================================================
   STATUS BAR
========================================================= */

.status-grid {
  position:relative;
  z-index:2;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  margin-bottom:14px;
}

.status-card {
  min-height:55px;

  padding:
    8px 5px;

  text-align:center;

  border:
    1px solid rgba(39,191,255,.19);

  background:
    rgba(5,20,33,.60);
}

.status-label {
  color:var(--muted);

  font-size:6px;
  letter-spacing:1.2px;
}

.status-value {
  margin-top:6px;

  font-size:7px;
  letter-spacing:1px;

  color:var(--success);
}

.dot {
  display:inline-block;

  width:5px;
  height:5px;

  margin-right:4px;

  border-radius:50%;

  background:var(--success);

  box-shadow:
    0 0 7px rgba(82,239,180,.9);
}

/* =========================================================
   CORE SCANNER
========================================================= */

.scanner-section {
  position:relative;
  z-index:2;

  display:flex;
  justify-content:center;
}

.scan-zone {
  position:relative;

  width:min(78vw,330px);
  height:min(78vw,330px);

  max-width:330px;
  max-height:330px;

  min-width:230px;
  min-height:230px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* feste Grundringe */

.base-ring {
  position:absolute;

  border-radius:50%;
}

.r1 {
  width:97%;
  height:97%;

  border:
    1px solid rgba(57,199,255,.30);

  box-shadow:
    0 0 22px rgba(34,170,244,.06);
}

.r2 {
  width:82%;
  height:82%;

  border:
    1px solid rgba(68,198,255,.26);
}

.r3 {
  width:65%;
  height:65%;

  border:
    1px solid rgba(118,221,255,.42);

  box-shadow:
    inset 0 0 25px rgba(32,166,230,.06);
}

/* äußere Tick-Skala */

.tick-ring {
  position:absolute;

  width:89%;
  height:89%;

  border-radius:50%;

  background:
    repeating-conic-gradient(
      rgba(113,218,255,.60)
      0deg 1deg,
      transparent
      1deg 5deg
    );

  -webkit-mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 3px),
      black calc(100% - 2px)
    );

  mask:
    radial-gradient(
      farthest-side,
      transparent calc(100% - 3px),
      black calc(100% - 2px)
    );

  opacity:.55;
}

/* rotierende Kurzsegmente */

.segment-layer {
  position:absolute;

  width:92%;
  height:92%;

  border-radius:50%;

  animation:
    rotateSegments
    11s
    linear
    infinite;
}

.segment-layer.secondary {
  width:76%;
  height:76%;

  animation:
    rotateSegmentsReverse
    16s
    linear
    infinite;
}

.segment {
  position:absolute;

  left:50%;
  top:50%;

  width:15%;
  height:5px;

  margin-left:-7.5%;
  margin-top:-2px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #86e0ff,
      #25bfff,
      transparent
    );

  box-shadow:
    0 0 8px rgba(51,194,255,.75),
    0 0 15px rgba(51,194,255,.28);

  transform-origin:
    50%
    calc(50% + 138px);
}

/*
Segmente werden mit translate
auf einer echten Kreisbahn gesetzt
*/

.seg1 {
  transform:
    rotate(10deg)
    translateY(-138px);
}

.seg2 {
  transform:
    rotate(86deg)
    translateY(-138px);
}

.seg3 {
  transform:
    rotate(169deg)
    translateY(-138px);
}

.seg4 {
  transform:
    rotate(248deg)
    translateY(-138px);
}

.seg5 {
  transform:
    rotate(318deg)
    translateY(-138px);
}

/* innere Segmente */

.secondary .segment {
  width:11%;
  height:3px;

  margin-left:-5.5%;

  transform-origin:
    50%
    calc(50% + 112px);

  opacity:.80;
}

.secondary .seg1 {
  transform:
    rotate(30deg)
    translateY(-112px);
}

.secondary .seg2 {
  transform:
    rotate(125deg)
    translateY(-112px);
}

.secondary .seg3 {
  transform:
    rotate(222deg)
    translateY(-112px);
}

.secondary .seg4 {
  transform:
    rotate(305deg)
    translateY(-112px);
}

.secondary .seg5 {
  display:none;
}

/* feste N-Core Marker */

.marker {
  position:absolute;

  width:9px;
  height:9px;

  border-top:
    1px solid rgba(139,226,255,.8);

  border-left:
    1px solid rgba(139,226,255,.8);

  transform:
    rotate(45deg);

  opacity:.75;
}

.m-top {
  top:5%;
}

.m-right {
  right:5%;
  transform:
    rotate(135deg);
}

.m-bottom {
  bottom:5%;
  transform:
    rotate(225deg);
}

.m-left {
  left:5%;
  transform:
    rotate(315deg);
}

/* center */

.center-core {
  position:absolute;

  width:54%;
  height:54%;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid rgba(127,220,255,.5);

  background:
    radial-gradient(
      circle,
      rgba(24,94,139,.18),
      rgba(2,12,21,.85) 68%
    );

  box-shadow:
    inset 0 0 30px rgba(28,172,238,.08),
    0 0 18px rgba(25,166,235,.08);
}

/* axis */

.axis-x,
.axis-y {
  position:absolute;

  background:
    rgba(47,177,238,.11);
}

.axis-x {
  width:94%;
  height:1px;
}

.axis-y {
  width:1px;
  height:94%;
}

/* scan brackets */

.scan-bracket {
  position:absolute;

  width:20px;
  height:20px;

  border-color:#b9efff;

  filter:
    drop-shadow(
      0 0 5px rgba(82,199,255,.7)
    );
}

.b1 {
  left:37%;
  top:36%;

  border-left:2px solid;
  border-top:2px solid;
}

.b2 {
  right:37%;
  top:36%;

  border-right:2px solid;
  border-top:2px solid;
}

.b3 {
  left:37%;
  bottom:36%;

  border-left:2px solid;
  border-bottom:2px solid;
}

.b4 {
  right:37%;
  bottom:36%;

  border-right:2px solid;
  border-bottom:2px solid;
}

/* copy */

.scan-copy {
  position:relative;
  z-index:10;

  text-align:center;

  width:54%;
}

.nfc-symbol {
  color:#8ce5ff;

  font-size:25px;

  line-height:1;

  transform:
    rotate(90deg);

  text-shadow:
    0 0 9px rgba(55,191,255,.85);
}

.scan-main {
  margin-top:12px;

  color:#f2fbff;

  font-size:11px;
  letter-spacing:1.8px;
}

.scan-sub {
  margin-top:5px;

  color:#769eb5;

  font-size:6px;
  letter-spacing:1.1px;
}

.scan-small {
  margin-top:7px;

  color:#50bde8;

  font-size:5.6px;
  line-height:1.4;

  overflow-wrap:anywhere;
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes rotateSegments {
  from {
    transform:rotate(0deg);
  }

  to {
    transform:rotate(360deg);
  }
}

@keyframes rotateSegmentsReverse {
  from {
    transform:rotate(360deg);
  }

  to {
    transform:rotate(0deg);
  }
}

@keyframes centerPulse {

  0%,
  100% {
    box-shadow:
      inset 0 0 30px rgba(28,172,238,.08),
      0 0 18px rgba(25,166,235,.08);
  }

  50% {
    box-shadow:
      inset 0 0 38px rgba(28,172,238,.14),
      0 0 30px rgba(25,166,235,.20);
  }
}

/* SCANNING */

.scan-zone.active
.segment-layer {
  animation-duration:1.5s;
}

.scan-zone.active
.segment-layer.secondary {
  animation-duration:.9s;
}

.scan-zone.active
.center-core {
  animation:
    centerPulse
    .85s
    ease-in-out
    infinite;
}

/* SUCCESS */

.scan-zone.success
.segment {
  background:
    linear-gradient(
      90deg,
      transparent,
      #a2ffe0,
      #52efb4,
      transparent
    );

  box-shadow:
    0 0 10px rgba(82,239,180,.8);
}

.scan-zone.success
.center-core {
  border-color:
    rgba(82,239,180,.75);

  box-shadow:
    inset 0 0 30px rgba(82,239,180,.10),
    0 0 30px rgba(82,239,180,.13);
}

/* ERROR */

.scan-zone.error
.segment {
  background:
    linear-gradient(
      90deg,
      transparent,
      #ff9aa2,
      #ff6874,
      transparent
    );

  box-shadow:
    0 0 9px rgba(255,104,116,.55);
}

.scan-zone.error
.center-core {
  border-color:
    rgba(255,104,116,.72);
}

/* =========================================================
   INPUTS
========================================================= */

.data-grid {
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:12px;
}

.field {
  padding:8px;

  border:
    1px solid rgba(39,191,255,.27);

  background:
    rgba(4,18,30,.72);
}

.field label {
  display:block;

  margin-bottom:6px;

  color:var(--muted);

  font-size:6px;
  letter-spacing:1.2px;
}

input {
  width:100%;
  height:44px;

  border:
    1px solid rgba(39,191,255,.34);

  outline:none;

  background:
    rgba(1,9,16,.84);

  color:#f1fbff;

  text-align:center;

  font-size:15px;

  letter-spacing:1.3px;
}

input:focus {
  border-color:var(--blue);

  box-shadow:
    0 0 10px rgba(39,191,255,.12);
}

/* =========================================================
   BUTTON
========================================================= */

.scan-button {
  position:relative;
  z-index:2;

  width:100%;

  min-height:56px;

  margin-top:10px;

  border:
    1px solid rgba(65,201,255,.65);

  color:white;

  background:
    linear-gradient(
      180deg,
      rgba(15,109,165,.72),
      rgba(5,52,86,.82)
    );

  letter-spacing:2.8px;

  font-size:10px;

  cursor:pointer;

  overflow:hidden;

  box-shadow:
    inset 0 0 19px rgba(39,191,255,.12),
    0 0 15px rgba(39,191,255,.07);
}

.scan-button::after {
  content:"";

  position:absolute;

  top:0;
  left:-40%;

  width:26%;
  height:100%;

  transform:
    skewX(-20deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(157,230,255,.27),
      transparent
    );

  animation:
    buttonSweep 4s
    infinite;
}

@keyframes buttonSweep {

  0%,
  68% {
    left:-40%;
  }

  100% {
    left:125%;
  }
}

.scan-button:disabled {
  opacity:.38;

  cursor:default;
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
  position:relative;
  z-index:2;

  margin-top:10px;

  min-height:92px;

  padding:12px;

  border:
    1px solid rgba(39,191,255,.23);

  background:
    rgba(2,12,21,.78);
}

.message-label {
  margin-bottom:8px;

  color:#64acce;

  font-size:6px;
  letter-spacing:1.4px;
}

#status {
  color:#ecf9ff;

  font-size:9px;

  line-height:1.55;

  letter-spacing:1px;

  white-space:pre-line;
}

#status.success {
  color:var(--success);
}

#status.error {
  color:var(--error);
}

#status.uid {
  color:var(--blue3);
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
  position:relative;
  z-index:2;

  margin-top:12px;

  padding-top:10px;

  border-top:
    1px solid rgba(39,191,255,.18);

  display:flex;

  justify-content:space-between;

  gap:12px;

  color:#5b8ca7;

  font-size:5.8px;
  letter-spacing:1.1px;
}

.footer strong {
  color:#62c7f6;

  font-weight:400;
}

.build {
  margin-top:10px;

  color:#4297c2;

  text-align:center;

  font-size:6px;
  letter-spacing:2px;
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width:430px) {

  .terminal {
    padding-top:305px;
  }

  .interface-panel {
    padding:
      12px 8px 14px;
  }

  .scan-zone {
    width:min(82vw,310px);
    height:min(82vw,310px);
  }

  .heading-main {
    font-size:11px;
  }

  .scan-main {
    font-size:9px;
  }

  .footer {
    font-size:5px;
  }
}

</style>
</head>

<body>

<div class="background"></div>

<div class="page">

<div class="terminal">

<div class="terminal-heading">

  <div class="heading-main">
    N-CORE REGISTRATION TERMINAL
  </div>

  <div class="heading-sub">
    SCAN // IDENTIFY // REGISTER
  </div>

</div>


<div class="interface-panel">


<!-- SYSTEM STATUS -->

<div class="status-grid">

  <div class="status-card">

    <div class="status-label">
      SYSTEM
    </div>

    <div class="status-value">
      <span class="dot"></span>
      ONLINE
    </div>

  </div>


  <div class="status-card">

    <div class="status-label">
      DATABASE
    </div>

    <div
      class="status-value"
      id="databaseState">

      <span class="dot"></span>
      LINKING

    </div>

  </div>


  <div class="status-card">

    <div class="status-label">
      NFC INTERFACE
    </div>

    <div
      class="status-value"
      id="nfcState">

      <span class="dot"></span>
      READY

    </div>

  </div>

</div>


<!-- SCANNER -->

<div class="scanner-section">

<div
  class="scan-zone"
  id="scanZone">


  <div class="axis-x"></div>
  <div class="axis-y"></div>


  <div class="base-ring r1"></div>
  <div class="base-ring r2"></div>
  <div class="base-ring r3"></div>


  <div class="tick-ring"></div>


  <div class="segment-layer">

    <div class="segment seg1"></div>
    <div class="segment seg2"></div>
    <div class="segment seg3"></div>
    <div class="segment seg4"></div>
    <div class="segment seg5"></div>

  </div>


  <div class="segment-layer secondary">

    <div class="segment seg1"></div>
    <div class="segment seg2"></div>
    <div class="segment seg3"></div>
    <div class="segment seg4"></div>
    <div class="segment seg5"></div>

  </div>


  <div class="marker m-top"></div>
  <div class="marker m-right"></div>
  <div class="marker m-bottom"></div>
  <div class="marker m-left"></div>


  <div class="center-core"></div>


  <div class="scan-bracket b1"></div>
  <div class="scan-bracket b2"></div>
  <div class="scan-bracket b3"></div>
  <div class="scan-bracket b4"></div>


  <div class="scan-copy">

    <div class="nfc-symbol">
      )))
    </div>

    <div
      class="scan-main"
      id="scanMain">

      SYSTEM READY

    </div>

    <div
      class="scan-sub"
      id="scanSub">

      WAITING FOR N-CORE

    </div>

    <div
      class="scan-small"
      id="scanSmall">

      NFC ENERGY INTERFACE

    </div>

  </div>

</div>

</div>


<!-- INPUT -->

<div class="data-grid">

  <div class="field">

    <label>
      N-CORE IDENTIFIER
    </label>

    <input
      id="core"
      type="text"
      placeholder="NC-001">

  </div>


  <div class="field">

    <label>
      STORED ENERGY
    </label>

    <input
      id="energy"
      type="number"
      inputmode="numeric"
      placeholder="000">

  </div>

</div>


<button
  class="scan-button"
  id="scanButton"
  onclick="scanNFC()"
  disabled>

  INITIALIZE NFC SCAN

</button>


<div class="message">

  <div class="message-label">
    SYSTEM MESSAGE
  </div>

  <div id="status">
    CONNECTING TO NEXORA DATABASE...
  </div>

</div>


<div class="footer">

  <div>
    <strong>NEXORA</strong>
    // CENTRAL OPERATIONS
  </div>

  <div>
    WÜRZBURG // FIELD NETWORK
  </div>

</div>


<div class="build">
  SYSTEM BUILD // REG-1.1
</div>


</div>
</div>
</div>


<script>

/* =========================================================
   API
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycby1cZye2Z46M2ydV6-TcurgOwmS8H4Bh6eXZJ3Z76TUs2oPO5eq6l-RGL0AyVQmfpeM3w/exec";

let scanRunning = false;
let scanController = null;


/* =========================================================
   VISUAL STATES
========================================================= */

function setScanVisual(
  mode,
  main,
  sub,
  small = "NFC ENERGY INTERFACE"
) {

  const zone =
    document.getElementById("scanZone");

  zone.classList.remove(
    "active",
    "success",
    "error"
  );

  if (mode) {
    zone.classList.add(mode);
  }

  document
    .getElementById("scanMain")
    .innerText = main;

  document
    .getElementById("scanSub")
    .innerText = sub;

  document
    .getElementById("scanSmall")
    .innerText = small;
}


function setDatabaseState(text) {

  document
    .getElementById("databaseState")
    .innerHTML =
      '<span class="dot"></span>' +
      text;
}


function setNfcState(text) {

  document
    .getElementById("nfcState")
    .innerHTML =
      '<span class="dot"></span>' +
      text;
}


/* =========================================================
   JSONP
========================================================= */

function apiRequest(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "nexoraCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error(
            "SERVER RESPONSE TIMEOUT"
          )
        );

      }, 10000);


    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {

        script.parentNode
          .removeChild(script);
      }

      try {

        delete window[callbackName];

      } catch(error) {

        window[callbackName] =
          undefined;
      }
    }


    window[callbackName] =
      data => {

        cleanup();

        resolve(data);
      };


    const query =
      new URLSearchParams({
        ...params,
        callback: callbackName,
        _: Date.now()
      });


    script.onerror =
      () => {

        cleanup();

        reject(
          new Error(
            "SERVER CONNECTION ERROR"
          )
        );
      };


    script.src =
      API +
      "?" +
      query.toString();


    document
      .body
      .appendChild(script);
  });
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeTerminal() {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("scanButton");

  const coreInput =
    document.getElementById("core");

  const energyInput =
    document.getElementById("energy");


  setDatabaseState("LINKING");

  setScanVisual(
    "active",
    "INITIALIZING",
    "DATABASE LINK"
  );


  try {

    const response =
      await apiRequest({
        action:"nextfree"
      });


    if (!response.ok) {

      throw new Error(
        response.error ||
        "UNKNOWN SERVER ERROR"
      );
    }


    setDatabaseState("CONNECTED");


    if (!response.nextFreeCore) {

      setScanVisual(
        "success",
        "SERIES COMPLETE",
        "ALL N-CORES REGISTERED"
      );

      status.className =
        "success";

      status.innerText =
        "REGISTRATION SERIES COMPLETE\n\n" +
        "ALL N-CORES REGISTERED";

      button.disabled =
        true;

      return;
    }


    coreInput.value =
      response.nextFreeCore;

    energyInput.value =
      "";


    setScanVisual(
      "",
      "SYSTEM READY",
      "WAITING FOR N-CORE"
    );


    status.className =
      "";

    status.innerText =
      "SYSTEM READY\n\n" +
      "NEXT // " +
      response.nextFreeCore;


    button.disabled =
      false;


    energyInput.focus();

  } catch(error) {

    setDatabaseState("OFFLINE");

    setScanVisual(
      "error",
      "LINK FAILURE",
      "DATABASE UNAVAILABLE"
    );

    status.className =
      "error";

    status.innerText =
      "DATABASE CONNECTION ERROR\n\n" +
      error.message;

    button.disabled =
      true;
  }
}


/* =========================================================
   NFC SCAN
========================================================= */

async function scanNFC() {

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("scanButton");


  if (scanRunning) {
    return;
  }


  if (!("NDEFReader" in window)) {

    setScanVisual(
      "error",
      "NFC OFFLINE",
      "INTERFACE NOT AVAILABLE"
    );

    status.className =
      "error";

    status.innerText =
      "NFC INTERFACE NOT AVAILABLE\n\n" +
      "Android + Chrome erforderlich.";

    return;
  }


  let core =
    document
      .getElementById("core")
      .value
      .trim()
      .toUpperCase();


  let energy =
    document
      .getElementById("energy")
      .value
      .trim();


  if (!/^NC-\d{3}$/.test(core)) {

    setScanVisual(
      "error",
      "INPUT ERROR",
      "INVALID CORE IDENTIFIER"
    );

    status.className =
      "error";

    status.innerText =
      "CORE ID FORMAT ERROR\n\n" +
      "Beispiel: NC-001";

    return;
  }


  const coreNumber =
    parseInt(
      core.substring(3),
      10
    );


  if (
    coreNumber < 1 ||
    coreNumber > 200
  ) {

    setScanVisual(
      "error",
      "INPUT ERROR",
      "CORE OUT OF RANGE"
    );

    status.className =
      "error";

    status.innerText =
      "CORE OUT OF RANGE\n\n" +
      "NC-001 // NC-200";

    return;
  }


  if (!energy) {

    setScanVisual(
      "error",
      "INPUT ERROR",
      "ENERGY VALUE REQUIRED"
    );

    status.className =
      "error";

    status.innerText =
      "ENERGY VALUE MISSING";

    return;
  }


  try {

    scanRunning = true;

    button.disabled = true;


    scanController =
      new AbortController();


    const reader =
      new NDEFReader();


    let handled = false;


    reader.onreading =
      async event => {


        if (
          handled ||
          !scanRunning
        ) {
          return;
        }


        handled = true;

        scanRunning = false;


        if (scanController) {

          scanController.abort();

          scanController = null;
        }


        core =
          document
            .getElementById("core")
            .value
            .trim()
            .toUpperCase();


        energy =
          document
            .getElementById("energy")
            .value
            .trim();


        const uid =
          String(
            event.serialNumber ||
            ""
          )
            .trim()
            .toUpperCase();


        if (!uid) {

          button.disabled = false;

          setScanVisual(
            "error",
            "READ FAILURE",
            "UID NOT AVAILABLE"
          );

          status.className =
            "error";

          status.innerText =
            "N-CORE DETECTED\n\n" +
            "UID NOT AVAILABLE";

          return;
        }


        setNfcState("DETECTED");


        setScanVisual(
          "active",
          "N-CORE DETECTED",
          "VERIFYING UID",
          uid
        );


        status.className =
          "uid";

        status.innerText =
          "N-CORE DETECTED\n\n" +
          "REGISTERING // " +
          core +
          "\n" +
          "ENERGY // " +
          energy +
          "\n" +
          "UID // " +
          uid +
          "\n\n" +
          "CONNECTING TO NEXORA DATABASE...";


        try {

          const response =
            await apiRequest({
              action:"register",
              core:core,
              energy:energy,
              uid:uid
            });


          if (!response.ok) {

            setScanVisual(
              "error",
              "REGISTRATION DENIED",
              "DATABASE REJECTED"
            );

            status.className =
              "error";

            status.innerText =
              "REGISTRATION REJECTED\n\n" +
              (
                response.error ||
                "UNKNOWN SERVER ERROR"
              ) +
              "\n\nNO DATA CHANGED";


            setNfcState("READY");

            button.disabled = false;

            return;
          }


          setScanVisual(
            "success",
            "CONFIRMED",
            response.core +
            " // REGISTERED",
            response.uid
          );


          status.className =
            "success";

          status.innerText =
            "N-CORE REGISTERED\n\n" +
            response.core +
            "\n" +
            "ENERGY // " +
            response.energy +
            "\n" +
            "UID // " +
            response.uid +
            "\n\n" +
            "CHIP STATUS // " +
            response.chipStatus;


          setNfcState("READY");


          setTimeout(() => {

            if (
              response.nextFreeCore
            ) {

              document
                .getElementById("core")
                .value =
                  response.nextFreeCore;


              document
                .getElementById("energy")
                .value =
                  "";


              setScanVisual(
                "",
                "SYSTEM READY",
                "WAITING FOR N-CORE"
              );


              status.className =
                "";

              status.innerText =
                "SYSTEM READY\n\n" +
                "NEXT // " +
                response.nextFreeCore;


              button.disabled =
                false;


              document
                .getElementById("energy")
                .focus();


            } else {

              setScanVisual(
                "success",
                "SERIES COMPLETE",
                "ALL N-CORES REGISTERED"
              );


              status.className =
                "success";

              status.innerText =
                "REGISTRATION SERIES COMPLETE\n\n" +
                "ALL N-CORES REGISTERED";


              button.disabled =
                true;
            }

          }, 2600);


        } catch(error) {

          setScanVisual(
            "error",
            "LINK FAILURE",
            "REGISTRATION NOT CONFIRMED"
          );

          button.disabled =
            false;

          status.className =
            "error";

          status.innerText =
            "DATABASE CONNECTION ERROR\n\n" +
            error.message +
            "\n\nREGISTRATION NOT CONFIRMED";


          setNfcState("READY");
        }
      };


    reader.onreadingerror =
      () => {

        scanRunning =
          false;


        if (scanController) {

          scanController.abort();

          scanController =
            null;
        }


        button.disabled =
          false;


        setScanVisual(
          "error",
          "READ FAILURE",
          "PRESENT N-CORE AGAIN"
        );


        status.className =
          "error";

        status.innerText =
          "NFC READ ERROR\n\n" +
          "N-Core erneut an das Smartphone halten.";


        setNfcState("READY");
      };


    await reader.scan({
      signal:
        scanController.signal
    });


    setNfcState("SCANNING");


    setScanVisual(
      "active",
      "SCANNING",
      "PRESENT N-CORE"
    );


    status.className =
      "";

    status.innerText =
      "NFC INTERFACE ACTIVE\n\n" +
      "PRESENT N-CORE";


  } catch(error) {

    scanRunning =
      false;

    scanController =
      null;

    button.disabled =
      false;


    if (
      error.name ===
      "AbortError"
    ) {
      return;
    }


    setScanVisual(
      "error",
      "NFC FAILURE",
      "INTERFACE ERROR"
    );


    status.className =
      "error";

    status.innerText =
      "NFC ERROR\n\n" +
      error.message;


    setNfcState("READY");
  }
}


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "load",
  initializeTerminal
);

</script>
