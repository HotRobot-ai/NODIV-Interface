<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a11"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles/nodiv.css?v=20261005-catch-ghost">
<title>NODIV // APP V1</title>
<style>
:root{--bg:#05090d;--cyan:#39c8ff;--text:#edf8ff;--muted:#7890a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05090d;color:var(--text);font-family:system-ui,sans-serif}
body{display:grid;place-items:center;padding:18px;overflow-x:hidden}
#app{width:min(520px,100%);position:relative;min-height:620px;border:1px solid #173448;background:linear-gradient(180deg,#07111b,#04080c);border-radius:22px;overflow:hidden}
.scanline{position:absolute;inset:-30% 0 auto;height:30%;background:linear-gradient(transparent,#39c8ff18,transparent);animation:scan 3.4s linear infinite;pointer-events:none}
@keyframes scan{to{transform:translateY(650px)}}.boot{padding:46px 24px;text-align:center}.brand{font-size:34px;font-weight:950;letter-spacing:.25em}.brand b{color:var(--cyan)}
.kicker{margin-top:8px;color:var(--muted);font:700 11px monospace;letter-spacing:.16em}.core{margin:54px auto 28px;width:132px;height:132px;border:1px solid #27769b;border-radius:50%;display:grid;place-items:center;position:relative;animation:pulse 2.3s ease-in-out infinite}
.core:before,.core:after{content:"";position:absolute;border:1px solid #18465d;border-radius:50%;inset:12px}.core:after{inset:28px;border-style:dashed;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 30px #39c8ff25}}
.status{font:800 12px monospace;letter-spacing:.12em;color:#9edfff}.bar{height:3px;background:#102532;margin:20px auto;width:80%;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cyan);animation:load 2.6s ease forwards}@keyframes load{to{width:100%}}
.enter{opacity:0;transform:translateY(8px);animation:reveal .5s 2.45s forwards}@keyframes reveal{to{opacity:1;transform:none}}
button{width:100%;min-height:56px;border:1px solid #27769b;border-radius:10px;background:#0b2535;color:#eaf9ff;font-weight:900;letter-spacing:.09em;font-size:14px}
.note{margin-top:13px;color:var(--muted);font:11px/1.5 monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.enter{opacity:1;transform:none}.bar i{width:100%}}
</style>
</head>
<body><main id="app" data-role="PIONEER"><div class="scanline"></div><div class="nd-scanline"></div><section class="boot" id="bootView">
<div class="brand">NO<b>DIV</b></div><div class="kicker">NODE DIVISION // APP V1 FOUNDATION</div>
<div class="core"><span class="status">CORE<br>ONLINE</span></div>
<div class="status">INITIALIZING FIELD INTERFACE</div><div class="bar"><i></i></div>
<div class="enter"><button class="nd-action" id="identityBtn" type="button">INITIALIZE ACCESS CARD</button>
<div class="note" id="msg">Phase 1 // App-Shell. Live-Spielstände werden noch nicht verändert.</div></div>
</section><section id="roleView" class="role-view" hidden></section></main>
<script type="module">
import {emitNodiv} from "./js/motion.js?v=20261003-2335";
import {startIdentity} from "./js/identity.js?v=20261010-restore-rescan";
emitNodiv("APP_BOOT",{target:"#app"});
document.getElementById("identityBtn").addEventListener("click",startIdentity);
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v=20261004-ops3").catch(()=>{});
</script></body></html>
