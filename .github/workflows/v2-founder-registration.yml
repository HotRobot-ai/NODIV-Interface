name: V2 Founder Registration CI

on:
  push:
    branches: [feature/v2-founder-registration, feature/v2-block06a-test-prep]
  pull_request:
    branches: [feature/v2-block06-full-flow]
  workflow_dispatch:

jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server regression
        working-directory: v2/server
        run: node --test *.test.mjs
      - name: Lab regression including Founder registration
        working-directory: v2/minipc-lab
        run: npm test
      - name: Browser client syntax
        working-directory: v2/minipc-lab
        run: node --check client/app.js
      - name: Build BLOCK 06 realtest package
        shell: bash
        run: |
          set -euo pipefail
          out="NODIV-V2-BLOCK06A-REALTEST-RELEASE"
          mkdir -p "$out/v2"
          cp -R v2/minipc-lab "$out/v2/minipc-lab"
          cp -R v2/server "$out/v2/server"
          cp v2/BLOCK06-REALTEST.md "$out/BLOCK06-REALTEST.md"
          rm -rf "$out/v2/minipc-lab/tests" "$out/v2/minipc-lab/scripts"
          find "$out/v2/server" -type f -name '*.test.mjs' -delete
          rm -f "$out/v2/minipc-lab/START-TEST.cmd" "$out/v2/minipc-lab/RESET-TEST.cmd"
          find "$out" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -delete
          printf '@echo off\r\nif /I "%%~1"=="--smoke" (\r\n  if not exist "%%~dp0v2\\minipc-lab\\NODIV-V2-STARTER.cmd" exit /b 11\r\n  if not exist "%%~dp0v2\\server\\gameplay-runtime.mjs" exit /b 12\r\n  echo NODIV BLOCK06A STARTER SMOKE PASS\r\n  exit /b 0\r\n)\r\ncall "%%~dp0v2\\minipc-lab\\NODIV-V2-STARTER.cmd"\r\n' > "$out/NODIV-V2-BLOCK06A-STARTEN.cmd"
          printf 'GitHub commit: %s\nBranch: %s\nCI run: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > "$out/SOURCE.txt"
      - name: Smoke test BLOCK 06 package
        shell: bash
        run: |
          set -euo pipefail
          out="NODIV-V2-BLOCK06A-REALTEST-RELEASE"
          test -f "$out/NODIV-V2-BLOCK06A-STARTEN.cmd"
          test -f "$out/v2/minipc-lab/NODIV-V2-STARTER.cmd"
          test -f "$out/v2/server/gameplay-runtime.mjs"
          test ! -e "$out/v2/minipc-lab/RESET-TEST.cmd"
          test ! -e "$out/v2/minipc-lab/START-TEST.cmd"
          if find "$out" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) | grep -q .; then
            echo "State/secrets leaked into package" >&2
            exit 1
          fi
          (
            cd "$out/v2/minipc-lab"
            node -e "import('./server/server.mjs').then(()=>console.log('BLOCK06 package import smoke PASS'))"
          )
      - name: Upload BLOCK 06 realtest package
        uses: actions/upload-artifact@v4
        with:
          name: NODIV-V2-BLOCK06A-REALTEST
          path: NODIV-V2-BLOCK06A-REALTEST-RELEASE
          if-no-files-found: error
          retention-days: 14


  package-windows-smoke:
    needs: registration
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: NODIV-V2-BLOCK06A-REALTEST
          path: package
      - name: Windows starter path smoke
        shell: cmd
        run: package\NODIV-V2-BLOCK06A-STARTEN.cmd --smoke
      - name: Windows package import smoke
        shell: pwsh
        run: |
          Set-Location package\v2\minipc-lab
          node -e "import('./server/server.mjs').then(()=>console.log('BLOCK06A Windows package import PASS'))"
