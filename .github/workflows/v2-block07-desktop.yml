name: V2 Block07 Desktop Playable

on:
  push:
    branches: [feature/v2-block07-desktop-playable]
  pull_request:
    branches: [feature/v2-block06a-test-prep]
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared V2 server regression
        working-directory: v2/server
        run: node --test *.test.mjs
      - name: Desktop and lab regression
        working-directory: v2/minipc-lab
        run: npm test
      - name: Browser and desktop server syntax
        working-directory: v2/minipc-lab
        run: |
          node --check client/app.js
          node --check server/server.mjs
          node --check server/desktop-test.mjs
          node --check server/founder-registry.mjs
          node --check server/founder-recovery.mjs
          node --check server/seed.mjs
          node --check NODIV-V2-FOUNDER-RECOVERY.mjs
      - name: Build BLOCK 07 desktop package
        shell: bash
        run: |
          set -euo pipefail
          out="NODIV-V2-BLOCK07-DESKTOP-RELEASE"
          mkdir -p "$out/v2"
          cp -R v2/minipc-lab "$out/v2/minipc-lab"
          cp f6072312-e4b9-448b-84ee-3283e200b198.png "$out/v2/minipc-lab/client/nodiv-background.png"
          cp -R v2/server "$out/v2/server"
          cp v2/BLOCK07-DESKTOP.md "$out/BLOCK07-DESKTOP.md"
          rm -rf "$out/v2/minipc-lab/tests" "$out/v2/minipc-lab/scripts"
          find "$out/v2/server" -type f -name '*.test.mjs' -delete
          rm -f "$out/v2/minipc-lab/START-TEST.cmd" "$out/v2/minipc-lab/RESET-TEST.cmd"
          rm -f "$out/v2/minipc-lab/NODIV-V2-STARTER.cmd" "$out/v2/minipc-lab/NODIV-V2-STARTER.ps1"
          find "$out" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -delete
          printf '@echo off\r\nif /I "%%~1"=="--smoke" (\r\n  call "%%~dp0v2\\minipc-lab\\NODIV-V2-SPIELEN.cmd" --smoke\r\n  exit /b %%ERRORLEVEL%%\r\n)\r\ncall "%%~dp0v2\\minipc-lab\\NODIV-V2-SPIELEN.cmd"\r\n' > "$out/NODIV-V2-SPIELEN.cmd"
          printf 'GitHub commit: %s\nBranch: %s\nCI run: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > "$out/SOURCE.txt"
      - name: Smoke test BLOCK 07 package
        shell: bash
        run: |
          set -euo pipefail
          out="NODIV-V2-BLOCK07-DESKTOP-RELEASE"
          test -f "$out/NODIV-V2-SPIELEN.cmd"
          test -f "$out/v2/minipc-lab/NODIV-V2-SPIELEN.cmd"
          test -f "$out/v2/minipc-lab/NODIV-V2-SPIELEN.ps1"
          test -s "$out/v2/minipc-lab/client/nodiv-background.png"
          test -f "$out/v2/minipc-lab/NODIV-V2-FOUNDER-RECOVERY.mjs"
          test -f "$out/v2/minipc-lab/server/founder-recovery.mjs"
          test -f "$out/v2/server/gameplay-runtime.mjs"
          test ! -e "$out/v2/minipc-lab/NODIV-V2-STARTER.cmd"
          test ! -e "$out/v2/minipc-lab/RESET-TEST.cmd"
          if find "$out" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) | grep -q .; then
            echo "State/secrets leaked into package" >&2
            exit 1
          fi
          grep -q '^NODIV_LAB_MODE=desktop$' "$out/v2/minipc-lab/config.example.env"
          (
            cd "$out/v2/minipc-lab"
            node -e "import('./server/server.mjs').then(()=>console.log('BLOCK07 package import smoke PASS'))"
          )
      - name: Upload BLOCK 07 desktop package
        uses: actions/upload-artifact@v4
        with:
          name: NODIV-V2-BLOCK07-DESKTOP
          path: NODIV-V2-BLOCK07-DESKTOP-RELEASE
          if-no-files-found: error
          retention-days: 14

  package-windows-smoke:
    needs: desktop
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: NODIV-V2-BLOCK07-DESKTOP
          path: package
      - name: Windows starter path smoke
        shell: cmd
        run: package\NODIV-V2-SPIELEN.cmd --smoke
      - name: PowerShell starter syntax
        shell: pwsh
        run: |
          $raw = Get-Content package\v2\minipc-lab\NODIV-V2-SPIELEN.ps1 -Raw
          [void][scriptblock]::Create($raw)
          Write-Host 'BLOCK07 PowerShell syntax PASS'
      - name: Windows package import smoke
        shell: pwsh
        run: |
          Set-Location package\v2\minipc-lab
          node -e "import('./server/server.mjs').then(()=>console.log('BLOCK07 Windows package import PASS'))"
